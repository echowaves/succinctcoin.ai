# tickets.toml — epic-desktop-app's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused; it is not an order.
# Keys tickets.py does not know are ignored, so a team may add its own.
# Status never lives here: an entry with no plan and no leaf file is planned; its plan beside it carries `status`.

[[entry]]
id = 1
type = "story"
title = "Core: the running node (slot loop) + the UI data source (events + real read-API)"
description = "The prerequisite core work (the epic Notes record the source conflict: after epic 5 the core has every seam but NOT the integrated running node — startMining/getPeers/getBlock are SC-CORE-1 stubs and CoreEvents has only CoreStarted/CoreStopped, so the UI has nothing to show). Per AD-9's one-owner rule (core/events/ owns the event payload types AND the read-API signatures), this lands, in the core: (a) the integrated consensus/slot loop — the AD-9 'single writer, the consensus loop in the main process' — a bounded-poll, setTimeout-driven loop (AD-3: chain-time only, NO wall clock, NO RNG) that each window derives the challenge (5.x deriveWindowChallenge), signs the local ticket (4.2 signTicket), collects the gossiped tickets for the window (the net adapter's tickets topic), draws the winner (AD-7 drawWindow), mines the block (3.x mineBlock), applies it (AD-2 applyBlock — the single mutation path, never re-implemented), gossips it (the blocks topic), and emits a BlockApplied event; (b) the missing CoreEvents (BlockApplied and the other conventioned names — spine: events are PascalCase nouns) + the read-models (chain head: slot/hash/winner/ticket-count; balance) added to events/types.ts, the single owner; (c) the REAL read-API — getChainHead, getBalances, getPeers (wired to the net adapter's peers()), getBlock — replacing the SC-CORE-1 stubs; (d) a working startMining() (the loop is started explicitly; start() still only boots the store/genesis/first block). The node now runs end to end: a single node mines a block each window and the event stream + read-API reflect it. It COMPOSES the built seams (never re-implements any of them — AD-7/AD-2)."
verify = "A plain-Node (no shell, @libp2p/memory transport, zero real sockets) test drives createCore with the real ports (net adapter, FileChainStore, a clock, the offline gate) + one real identity (deriveIdentityKeypair in the test — keys stay in the core, AD-11), calls startMining(), and asserts: a BlockApplied event fires (bounded, event-driven — AD-3, no wall-clock assertion) carrying the winner identity id + slot + hash; getChainHead returns that slot + hash; getBalances returns the mint/recipient balance; getPeers returns the (single) node's peer id; getBlock returns the block; the loop is bounded-poll + setTimeout (a stop() halts it). The full core suite + typecheck + build PROTO_OK stay green; the core still imports zero electron/renderer/UI (AD-1); no proto change (PROTO_OK — this story touches src only)."
covers = ["R1", "E1", "E3"]
after = ["3.2", "4.2", "4.3", "5.5"]
hitl = false
risk = "high"
unknown = "The exact event names (BlockApplied / SlotWon / IdentityLapsed per the spine convention), the read-model shapes (chain head + balance), the slot-loop tick cadence (setTimeout ms — a test constant, chain-time), and whether the loop runs in start() or only startMining() are build decisions; the hard rules are AD-9 (core/events/ is the single owner of the event + read-API types, and the event stream + read-API is the COMPLETE UI data source), AD-2 (applyBlock only), AD-7 (drawWindow), AD-3 (chain-time — bounded polls + setTimeout, no wall clock, no RNG), AD-11 (keys stay in the core), AD-10 (plain-Node + memory transport in CI), and that the loop reuses the built seams (never re-implements draw/mine/apply/net)."

[[entry]]
id = 2
type = "story"
title = "App: Electron shell + preload/IPC bridge (AD-11) + core-suite headless parity"
description = "Stands up packages/app — a NEW pnpm workspace package (picked up by the packages/* glob) with the spine pins (electron 44.5.1, react 19.3.0, vite 8.3.2, @electron-forge/cli 8.0.1, vitest 5.0.3, TypeScript 5.x). The Electron MAIN process hosts the finished core: it constructs createCore with the real ports (the net adapter, the FileChainStore, a clock, the offline gate, and a uiSink that forwards the core's event stream over IPC) + one real identity (deriveIdentityKeypair in main — the keys LIVE in the main process, AD-11), and runs the node (6.1's startMining). The PRELOAD builds the contextBridge IPC boundary: it exposes the commands (start / stop / startMining), the event stream (a subscribe that delivers CoreEvents payloads to the renderer), and the read-API (getChainHead / getBalances / getPeers / getBlock) — and exposes NO key material (AD-11: the renderer receives only peer IDs, status, and signed artifacts; the keypair + .secret never cross). The core's test suite passes UNCHANGED under a plain-Node runner with no shell — the CAP-6 parity: packages/app is a separate package, so packages/core and its suite are untouched and still headless + socket-free; the root core test/typecheck/build scripts stay core-scoped (the parity holds by construction) and the app is package-local."
verify = "packages/app exists as a pnpm workspace package (packages/* glob; its own package.json with the spine pins + a workspace link to @succinctcoin/core); a headless test boots the MAIN-process core (createCore wired with the real ports over @libp2p/memory) and observes a BlockApplied event flow through the uiSink -> IPC seam; the preload exposes EXACTLY the command + event + read surface and NO key material (a test asserts the exposed IPC surface has no keypair/secret, and a static scan of the preload + renderer source finds NO reference to the identity keypair or .secret — AD-11); packages/core has zero electron/renderer/UI imports (AD-1, re-asserted); the packages/core test suite passes unchanged under a plain-Node runner (no shell, no sockets — the root core suite is green, CAP-6)."
covers = ["R1", "E1", "E2", "E3"]
after = [1]
hitl = false
risk = "high"
unknown = "The exact IPC channel names + the preload API surface (the contextBridge object shape) + whether the app declares @succinctcoin/core as a workspace dependency (it must, to resolve main -> dist/index.js, which needs a core build first) are build decisions; the hard rules are AD-1 (only the shell imports electron; the core has zero UI imports), AD-11 (identity keys never cross the IPC boundary in plaintext — the UI gets only peer IDs, status, signed artifacts), AD-9 (the UI reads via the core read-API, never mutates state), and CAP-6 (the core suite passes unchanged under plain-Node, no shell, no sockets)."

[[entry]]
id = 3
type = "story"
title = "App: React renderer (balance, mining status, network peers) + the AD-11 renderer check"
description = "Builds the React (Vite) renderer: a balance display, a mining-status panel (current slot, the last block's winner identity id + ticket count), and a network-peers list — all driven by the core event stream (subscribing to BlockApplied via the preload IPC) + the read-API for snapshots (getChainHead / getBalances / getPeers), NEVER polling (E1: the event stream + read-API is the complete UI data source — 'no polling' means never poll, not 'events alone suffice'). The renderer is a THIN adapter client of the core (AD-1): it imports ONLY the preload's typed IPC surface, never @succinctcoin/core internals and never bypasses applyBlock. The AD-11 renderer check: identity keys are ABSENT from the renderer (a static check — the renderer source references no key material, only peer IDs, status, and signed artifacts)."
verify = "The React UI renders a balance, a mining status (slot + last-block winner + ticket count), and a peers list, driven by subscribing to the core event stream + calling the read-API — a test asserts the renderer uses the event subscription + read-API and contains NO timer/poll (no setInterval-driven data fetch); the renderer is a thin client (a static check: it imports only the preload IPC surface, never @succinctcoin/core internals — AD-1); identity keys are absent from the renderer (a static check: the renderer source references no keypair / .secret / deriveIdentityKeypair — only peer IDs, status, signed artifacts — AD-11); the app's package-local typecheck + build (vite) are green."
covers = ["R1", "E1", "E2", "E3"]
after = [2]
hitl = false
risk = "medium"
unknown = "The exact React component structure + state approach (a thin adapter over the preload surface — a minimal state hook, no heavy framework) and the precise 'no polling' verification (event subscription + read-API only, no data-fetch timers) are build decisions; the hard rules are E1 (event stream + read-API is the complete UI data source, no polling), AD-1 (thin client, no core internals), AD-11 (no keys in the renderer), and AD-9 (read-only via the read-API)."

[[entry]]
id = 4
type = "story"
title = "App: electron-forge packaging + the closing end-to-end suite (full Done-when)"
description = "Wires electron-forge packaging (@electron-forge/cli 8.0.1) so packages/app packages into a runnable desktop app, and adds the CLOSING end-to-end suite (the 3.9 / 4.10 / 5.10 precedent — but this one is NOT test-only: it adds the forge config + the e2e). The e2e proves ALL FIVE epic Done-when in one integrated run: (1) the packaged app's main process starts a node on a testnet (@libp2p/memory transport) and blocks are mined — a BlockApplied event reaches the renderer's data source (the UI 'shows blocks being mined'); (2) the React UI's balance + mining status + network peers are driven by the event stream + read-API (no polling); (3) identity keys are absent from the renderer (the static check) and the IPC bridge exposes only signed artifacts + status; (4) the SAME packages/core test suite passes UNCHANGED under a plain-Node runner with no shell + no sockets (CAP-6 parity — the app is a separate package, the core suite is untouched); (5) the @libp2p/memory electron-main test target (verified present in @libp2p/memory 2.0.28) covers the in-app path. It COMPOSES the built seams (core node loop, the shell, the IPC bridge, the renderer) imported from their packages — never re-implementing any of them."
verify = "The electron-forge config is valid + packages the app (a test asserts the forge config resolves and the app's entry is the electron main process); the e2e boots the app's main process on a testnet (@libp2p/memory, zero real sockets) and observes a BlockApplied event reaching the renderer's data source within a bounded (event-driven, AD-3) time; the React UI's balance / mining / peers are driven by the event stream + read-API (no polling); identity keys are absent from the renderer (static check) + the IPC surface exposes only signed artifacts + status (AD-11); the packages/core suite passes unchanged under a plain-Node runner (no shell, no sockets — CAP-6); the @libp2p/memory electron-main target is the in-app path (verified present in @libp2p/memory 2.0.28); the full core suite + app package-local build stay green."
covers = ["R1", "R2", "R3", "E2"]
after = [3]
hitl = false
risk = "high"
unknown = "Whether the e2e boots a real (headless) electron spawn vs drives the main-process code path directly under vitest via the @libp2p/memory electron-main target is a build decision (the memory electron-main target is the spine's in-app path; a full electron spawn may be flaky headless — the decision is made when it starts); the hard rules are R2 (packaged app on a testnet + the core suite passes unchanged), R3 (CAP-6 headless parity, no shell, no sockets), E2 (no keys in the renderer), and AD-10 (memory transport, zero real sockets in CI)."
