# tickets.toml — epic-exact-money-ledger's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused; it is not an order.
# Keys tickets.py does not know are ignored, so a team may add its own.
# Status never lives here: an entry with no plan and no leaf file is planned; its plan beside it carries `status`.

[[entry]]
id = 1
type = "story"
title = "Ledger core: amounts, mutation seam, no-negative"
description = "Stands up core/ledger: integer base-unit (BigInt) balances, decimal-string encoding for wire/JSON/disk (raw BigInt banned from JSON), the display-conversion boundary (big.js, its 2nd boundary), the ledger's balance-mutation + invariant-check seam that epic 3's consensus applyBlock will invoke (the ledger never re-validates protocol rules, AD-2), the no-negative-balance invariant, and adds big.js 7.0.1 to packages/core dependencies (spine Stack; today only bench/ has it)."
verify = "Applying a transfer through the ledger seam moves exact base units between balances; a debit that would go negative is rejected; the ledger exposes no public mutator other than the seam; JSON.stringify of a balance yields a clean decimal string (no throw, no drift)."
covers = ["R1", "R3"]
after = ["1.1", "1.2"]
hitl = false
risk = "medium"
unknown = "The exact seam shape (e.g. a pure apply(transfers, {feeRate}) -> balances + invariants) is a code-level decision at build time; the display-conversion boundary (big.js's 2nd boundary) is a pure function in core/ledger (base-unit BigInt to human decimal string) the UI epic later consumes."

[[entry]]
id = 2
type = "story"
title = "Fee boundary (big.js)"
description = "Adds the fee = amount x rate boundary, computed with big.js at the ledger seam (big.js's 1st boundary), so no float artifact ever reaches a persisted balance (0.1 + 0.2 drift is impossible)."
verify = "The fee for seeded inputs is exactly amount x rate as a clean decimal string (asserted per testing.md 'assert exact strings'); a persisted balance after a fee shows no float artifact."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"
unknown = "Where the real fee rate comes from is undecided (genesis.json has no fee-rate field; adding one is a protocol change per the spine) — the test uses a fixed rate; provenance lands with the consensus epic or a later decision."

[[entry]]
id = 3
type = "story"
title = "Store persistence + BigInt round-trip"
description = "Persists ledger amounts as decimal strings through the store and proves a property test round-trips random BigInts up to 10^30 with no precision loss; float and int64 amount encodings are rejected."
verify = "A property test round-trips random BigInts (up to 10^30) through the store with no precision loss; a float/int64 amount encoding is rejected."
covers = ["E1"]
after = [2, "1.4", "1.5"]
hitl = false
risk = "medium"
unknown = "How the ledger's balance state is persisted through the existing StorePort (which today stores canonical block bytes) — snapshot record vs derived replay — is a code-level decision at build time (AD-9: the store owns on-disk state)."

[[entry]]
id = 4
type = "story"
title = "Conservation + fee invariant property tests"
description = "Adds property tests asserting conservation of supply, no-negative-balance, and fee invariants over long random transaction sequences (including the persisted-balance half, so it runs after store persistence)."
verify = "fast-check property tests assert supply conservation, no-negative-balance, and fee invariants hold over long random transaction sequences."
covers = ["R1", "R2", "R3"]
after = [3]
hitl = false
risk = "medium"
unknown = "The test's supply model: a closed system (no reward credit — mining is out of scope for this epic), with a decided fee destination (burn vs credit) and initial allocation, settled at build time; the real economic model lands with the consensus epic."

[[entry]]
id = 5
type = "story"
title = "big.js boundary + no-float guard"
description = "Adds a standing guard verifying big.js is referenced only in the fee and display modules, floating-point is banned from the ledger, and JSON.stringify of a balance never throws or drifts."
verify = "An import/scan check finds big.js only in the fee and display modules; no floating-point type appears in the ledger; JSON.stringify of a balance never throws or drifts."
covers = ["R1"]
after = [1, 2]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Refactor sweep"
description = "Runs the closing refactor sweep (cleanup only, scope set from the build records and deferred review findings) and confirms the ledger suite is green headless."
verify = "pnpm test and pnpm build pass in plain Node; the ledger's invariants and encoding hold; no capability logic was added."
covers = []
after = [1, 2, 3, 4, 5]
hitl = false
risk = "low"
