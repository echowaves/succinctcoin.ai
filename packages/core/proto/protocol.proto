// protocol.proto — the single source of truth for the SuccinctCoin wire
// schema (AD-8/AD-12). TS protocol types are GENERATED from this file by
// `protons` (see `generate:proto` in package.json); hand-written protocol
// types are banned (AD-12) — the generated file lives in src/proto/ and is
// committed so consumers + CI typecheck without a regen step.
//
// Conventions:
//   - Inside cryptographic digests all integers are big-endian fixed-width
//     (AD-12). NOTE: the golden vector (test/golden-vector.test.ts) pins the
//     WIRE encoding (the protons round-trip; int64 = varint). The digest
//     canonical encoding (BE fixed-width) is a DISTINCT serialization, defined
//     and pinned when the digest math lands (epic 3 draw / epic 4 verify).
//   - Money travels as decimal strings (AD-5) — Tx.amount / Tx.fee are
//     `string`, never int64/float.
//   - Identity / address fields are 32-byte hex strings (spine convention).
//   - Changing any field number later is a protocol change (genesis
//     version bump).
syntax = "proto3";

package succinctcoin;

// A mined block. Carries the winner's ticket AND nonce so the draw is
// verifiable from the block alone (AD-7). `hash` = sha256 over the canonical
// encoding of this message (AD-6), counter (nonce) included; the canonical
// digest form (BE fixed-width ints) is defined with the digest math (epic 3).
message Block {
  // Chain-time slot the block claims (AD-3).
  int64 slot = 1;
  // 32-byte hash of the previous block (big-endian fixed-width inside
  // digests, AD-12).
  bytes parentHash = 2;
  // 32-byte hex identity id of the winner.
  string winnerIdentityId = 3;
  // Canonical encoding of the winner's Ticket (AD-7).
  bytes winnerTicket = 4;
  // The PoW counter — part of the block identity (AD-6).
  bytes nonce = 5;
  // sha256 over the canonical encoding of this message (AD-6).
  bytes hash = 6;
  // Number of transactions in the block.
  int64 txCount = 7;
  // CAP-7 (ticket 8.3): proto-encoded `PeerAnnouncement` blobs anchored
  // IN THIS BLOCK — on-chain presence, the block-grade trust root of the
  // discovery ladder. Raw encoded bytes verbatim in the canonical digest
  // (the `winnerTicket` precedent: no re-encode canonicity hazard; the
  // receiving side DECODES + validates each via the core announcement
  // validator at THIS block's slot). Max 8 entries (budget cap).
  // Adding this field changed every block hash => protocol change
  // (genesis protocolVersion 1 -> 2, AD-12).
  repeated bytes announcements = 8;
}

// A per-window proof-of-attestation (AD-4). The signature (epic 4 verifies
// it) is over sha256(identityId || u64be(windowIndex) || challenge ||
// nonceCommitment) (AD-12).
message Ticket {
  // 32-byte hex identity id of the minter.
  string identityId = 1;
  // Chain-time window the ticket is bound to (AD-3).
  int64 windowIndex = 2;
  // Window challenge (derived from the fork point; no replay across forks).
  bytes challenge = 3;
  // Commitment to the PoW nonce (draw input, AD-7).
  bytes nonceCommitment = 4;
  // Identity signature (verification owned by epic 4).
  bytes signature = 5;
}

// A money movement. Amounts are decimal strings (AD-5), never int64/float.
message Tx {
  // 32-byte hex sender address.
  bytes sender = 1;
  // 32-byte hex recipient address.
  bytes recipient = 2;
  // Decimal string, integer base units (AD-5).
  string amount = 3;
  // Decimal string, integer base units (AD-5).
  string fee = 4;
  // Chain-time slot the tx is valid in (AD-3).
  int64 slot = 5;
  // Sender signature (verification owned by epic 5's ledger path).
  bytes signature = 6;
}

// A discovered peer (AD-8 gossip surface).
message PeerInfo {
  // 32-byte hex peer id.
  string peerId = 1;
  // Multiaddr strings for this peer.
  repeated string multiaddrs = 2;
  // Uptime in chain-time slots (draw weight input, AD-7).
  int64 uptime = 3;
}

// ---------------------------------------------------------------------------
// Gossipsub message envelopes (epic 5, story 5.2 — AD-8/AD-12).
//
// Each envelope wraps one payload class + the publisher's PROTOCOL identity
// id (the 4.2 Ed25519 identityId, 32-byte hex — NOT the libp2p transport
// peer id) and travels on its OWN topic (one stable topic per message
// class, AD-8):
//
//   /succinctcoin/blocks/1  → BlockEnvelope
//   /succinctcoin/tickets/1 → TicketEnvelope
//   /succinctcoin/tx/1      → TxEnvelope
//   /succinctcoin/peers/1   → PeerInfoEnvelope
//
// The topic already says which class is in flight, so there is no class
// discriminator field on the wire. PURELY ADDITIVE: the four payload
// messages above (`Block`/`Ticket`/`Tx`/`PeerInfo`) are UNCHANGED — no
// field-number or type changes (the ONE proto change in epic 5).
// ---------------------------------------------------------------------------

// Envelope for the blocks topic: the published block + its source.
message BlockEnvelope {
  // The published block (AD-7: carries the winner's ticket + nonce).
  Block block = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the tickets topic: the published ticket + its source.
message TicketEnvelope {
  // The published ticket (AD-4: per-window proof-of-attestation).
  Ticket ticket = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the tx topic: the published tx + its source.
message TxEnvelope {
  // The published tx (amounts as decimal strings, AD-5).
  Tx tx = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the peers topic: the published peer info + its source.
message PeerInfoEnvelope {
  // The published peer info (AD-8 gossip surface).
  PeerInfo peerInfo = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the announcements topic (CAP-7, ticket 8.3 —
// `/succinctcoin/announcements/1`): a gossiped signed announcement + its
// publisher. Verify-before-relay is the NODE LOOP's rule (validate before
// republish); every consumer re-validates regardless.
message AnnouncementEnvelope {
  // The gossiped announcement (signed, AD-12 digest of 8.2).
  PeerAnnouncement announcement = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// ---------------------------------------------------------------------------
// Chain sync (epic 5, story 5.4 — AD-8/AD-12).
//
// Sync is a PULL (a directed request/response over a dedicated libp2p STREAM
// — NOT a gossip topic, D1): the client sends ONE `SyncRequest`
// (`fromSlot`, the client's head + 1), half-closes, and reads the server's
// stream of `SyncBlock`s (one per window, `fromSlot` up to the peer's head)
// until the server half-closes. Both messages are proto-encoded (AD-12) and
// u32be length-prefix framed on the stream (framing is the transport's job,
// not the schema's). Each `SyncBlock` carries, for its window, the block +
// the window's accepted ticket set + the per-ticket uptime weights — exactly
// what the 4.3 acceptance path (`acceptBlockWinner`) needs, so a fresh node
// can verify every block it applies without having collected the gossiped
// tickets for historical windows itself (D3 — fetched alongside the payload).
// The challenge is NOT on the wire: the fresh node derives it from the block's
// own public data (`deriveWindowChallenge(parentHash, slot)`, 3.3).
//
// PURELY ADDITIVE: the eight existing messages (`Block`/`Ticket`/`Tx`/
// `PeerInfo` + the four envelopes) are UNCHANGED — no field-number or type
// changes.
// ---------------------------------------------------------------------------

// The sync request: the slot the client is missing STARTING FROM (its
// `headSlot + 1`; slot 0 for an empty chain). The server streams one
// `SyncBlock` per window from this slot up to its head.
message SyncRequest {
  // Chain-time slot to start the catch-up from (inclusive).
  int64 fromSlot = 1;
}

// One window of the sync stream: the block + the per-window accepted set the
// 4.3 acceptance path needs (D3 — supplied by the sync payload).
message SyncBlock {
  // The window's mined block (AD-7: carries the winner's ticket + nonce).
  Block block = 1;
  // The window's ACCEPTED ticket set (proto `Ticket`, AD-12 wire form) —
  // the per-ticket inputs to `acceptBlockWinner` (4.3), in the SAME order
  // as `weights`.
  repeated Ticket acceptedTickets = 2;
  // The window's per-ticket uptime weights (4.5), one per `acceptedTickets`
  // entry, in the SAME order.
  repeated int64 weights = 3;
}

// ---------------------------------------------------------------------------
// Bootstrap-free discovery (epic 8, CAP-7 — ticket-seeded discovery).
//
// A signed self-announcement: the record whose Ed25519 signature IS the
// liveness proof (the sybil cost of presence is the cost of mining). Carried
// in Block metadata (field 8, 8.3) AND gossiped on its own class topic via
// `AnnouncementEnvelope`; ticket 8.4 adds the third-party `Introduction`
// vouch + its envelope. PURELY ADDITIVE: every existing message is UNCHANGED.
// ---------------------------------------------------------------------------

// A peer's signed address announcement (CAP-7 / discovery-design.md).
message PeerAnnouncement {
  // 32-byte hex identity id of the announcing peer (4.2 Ed25519 identity).
  string identityId = 1;
  // The addresses to be reached at, multiaddr strings (1–8 entries — shape
  // limits pinned by the core validator, block-size budget defense).
  repeated string multiaddrs = 2;
  // The address this peer observed itself at, when known (NAT-visible
  // external address; absent for LAN-only peers).
  optional string observedExternalAddr = 3;
  // First chain-time slot the announcement claims validity for (AD-3 —
  // chain time, never a wall clock).
  int64 slotStart = 4;
  // Last chain-time slot the announcement claims validity for (>= start;
  // expiry is slot-parameterized so no peer ever needs a clock).
  int64 slotEnd = 5;
  // Network scope (from genesis `chainId`): testnet presence can never
  // contaminate mainnet books.
  string chainId = 6;
  // Ed25519 signature over the AD-12 canonical digest of the fields above
  // (pinned layout in core/src/discovery/announcements.ts).
  bytes signature = 7;
}

// A signed third-party vouch (CAP-7, ticket 8.4 — "saw identity X online at
// slot s"). Signed by the SIGNER only; the digest binds signer AND subject
// (a third party vouches unilaterally — the three-introductions rule needs
// introducers, not co-signers). A hint-grade address book entry becomes
// dial-eligible only after >= 3 introductions from DISTINCT signers. The
// signature domain is separate from PeerAnnouncement's (neither verifies
// as the other); pinned layout in core/src/discovery/introductions.ts.
message Introduction {
  // 32-byte hex identity id of the introducing peer (the signer —
  // `subjectIdentityId` can never be forged into a vouch by someone else).
  string signerIdentityId = 1;
  // 32-byte hex identity id of the introduced peer.
  string subjectIdentityId = 2;
  // Chain-time slot the signer observed the subject live at (AD-3 — never a
  // wall clock). A value greater than the validator's current slot rejects
  // (nobody can claim to have seen the future).
  int64 slotObserved = 3;
  // Reachability class the signer observed ('direct' | 'via-relay' | 'lan',
  // discovery-design.md) so NATed targets get usable addresses. Carried for
  // dial-time use (8.5+); no eligibility rule consumes it in MVP.
  string reachability = 4;
  // Network scope (genesis `chainId`) — same contamination guard as the
  // announcement's.
  string chainId = 5;
  // Ed25519 signature over the AD-12 canonical digest of the fields above.
  bytes signature = 6;
}

// Envelope for the introductions topic (CAP-7, ticket 8.4 —
// `/succinctcoin/introductions/1`): a gossiped signed introduction + its
// publisher. Verify-before-relay is the NODE LOOP's rule (validate before
// republish), exactly like the announcements class.
message IntroductionEnvelope {
  // The gossiped introduction (signed, AD-12 digest of 8.4).
  Introduction introduction = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// ---------------------------------------------------------------------------
// Peer-book exchange (epic 9, ticket 9.3 — recursive fill from one invite).
//
// A PULL over a dedicated libp2p STREAM (`/succinctcoin/peerbook/1`, the sync
// pattern — NOT a gossip topic): the client sends ONE `PeerBookRequest` and
// reads ONE `PeerBookResponse`, then the server half-closes. Both messages
// are proto-encoded (AD-12) and u32be length-prefix framed (framing is the
// transport's job). PURELY ADDITIVE: every existing message is UNCHANGED, and
// NEITHER message is reachable from any block digest (the block hash is
// sha256 over the canonical `Block` encoding only, AD-6) — so protocolVersion
// does NOT bump.
// ---------------------------------------------------------------------------

// The peer-book request: how many records the client wants at most.
message PeerBookRequest {
  // Max records the client will accept (the server clamps to its own bounds).
  uint32 limit = 1;
}

// The peer-book response: signed announcements + a witness vouch per record.
message PeerBookResponse {
  // Signed self-announcements (each independently verified by the receiver —
  // verify-before-connect; nothing here is trusted because it was served).
  repeated PeerAnnouncement records = 1;
  // FULL `Introduction` reuse (8.4): one SELF-SIGNED witness per served
  // record ("I verified this identity at slotObserved"), signed by the
  // RESPONDING node. The receiver's independence rule applies unchanged.
  repeated Introduction witnesses = 2;
}
