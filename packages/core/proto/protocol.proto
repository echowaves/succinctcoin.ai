// protocol.proto — the single source of truth for the SuccinctCoin wire
// schema (AD-8/AD-12). TS protocol types are GENERATED from this file by
// `protons` (see `generate:proto` in package.json); hand-written protocol
// types are banned (AD-12) — the generated file lives in src/proto/ and is
// committed so consumers + CI typecheck without a regen step.
//
// Conventions:
//   - Inside cryptographic digests all integers are big-endian fixed-width
//     (AD-12). NOTE: the golden vector (test/golden-vector.test.ts) pins the
//     WIRE encoding (the protons round-trip; int64 = varint). The digest
//     canonical encoding (BE fixed-width) is a DISTINCT serialization, defined
//     and pinned when the digest math lands (epic 3 draw / epic 4 verify).
//   - Money travels as decimal strings (AD-5) — Tx.amount / Tx.fee are
//     `string`, never int64/float.
//   - Identity / address fields are 32-byte hex strings (spine convention).
//   - Changing any field number later is a protocol change (genesis
//     version bump).
syntax = "proto3";

package succinctcoin;

// A mined block. Carries the winner's ticket AND nonce so the draw is
// verifiable from the block alone (AD-7). `hash` = sha256 over the canonical
// encoding of this message (AD-6), counter (nonce) included; the canonical
// digest form (BE fixed-width ints) is defined with the digest math (epic 3).
message Block {
  // Chain-time slot the block claims (AD-3).
  int64 slot = 1;
  // 32-byte hash of the previous block (big-endian fixed-width inside
  // digests, AD-12).
  bytes parentHash = 2;
  // 32-byte hex identity id of the winner.
  string winnerIdentityId = 3;
  // Canonical encoding of the winner's Ticket (AD-7).
  bytes winnerTicket = 4;
  // The PoW counter — part of the block identity (AD-6).
  bytes nonce = 5;
  // sha256 over the canonical encoding of this message (AD-6).
  bytes hash = 6;
  // Number of transactions in the block.
  int64 txCount = 7;
}

// A per-window proof-of-attestation (AD-4). The signature (epic 4 verifies
// it) is over sha256(identityId || u64be(windowIndex) || challenge ||
// nonceCommitment) (AD-12).
message Ticket {
  // 32-byte hex identity id of the minter.
  string identityId = 1;
  // Chain-time window the ticket is bound to (AD-3).
  int64 windowIndex = 2;
  // Window challenge (derived from the fork point; no replay across forks).
  bytes challenge = 3;
  // Commitment to the PoW nonce (draw input, AD-7).
  bytes nonceCommitment = 4;
  // Identity signature (verification owned by epic 4).
  bytes signature = 5;
}

// A money movement. Amounts are decimal strings (AD-5), never int64/float.
message Tx {
  // 32-byte hex sender address.
  bytes sender = 1;
  // 32-byte hex recipient address.
  bytes recipient = 2;
  // Decimal string, integer base units (AD-5).
  string amount = 3;
  // Decimal string, integer base units (AD-5).
  string fee = 4;
  // Chain-time slot the tx is valid in (AD-3).
  int64 slot = 5;
  // Sender signature (verification owned by epic 5's ledger path).
  bytes signature = 6;
}

// A discovered peer (AD-8 gossip surface).
message PeerInfo {
  // 32-byte hex peer id.
  string peerId = 1;
  // Multiaddr strings for this peer.
  repeated string multiaddrs = 2;
  // Uptime in chain-time slots (draw weight input, AD-7).
  int64 uptime = 3;
}

// ---------------------------------------------------------------------------
// Gossipsub message envelopes (epic 5, story 5.2 — AD-8/AD-12).
//
// Each envelope wraps one payload class + the publisher's PROTOCOL identity
// id (the 4.2 Ed25519 identityId, 32-byte hex — NOT the libp2p transport
// peer id) and travels on its OWN topic (one stable topic per message
// class, AD-8):
//
//   /succinctcoin/blocks/1  → BlockEnvelope
//   /succinctcoin/tickets/1 → TicketEnvelope
//   /succinctcoin/tx/1      → TxEnvelope
//   /succinctcoin/peers/1   → PeerInfoEnvelope
//
// The topic already says which class is in flight, so there is no class
// discriminator field on the wire. PURELY ADDITIVE: the four payload
// messages above (`Block`/`Ticket`/`Tx`/`PeerInfo`) are UNCHANGED — no
// field-number or type changes (the ONE proto change in epic 5).
// ---------------------------------------------------------------------------

// Envelope for the blocks topic: the published block + its source.
message BlockEnvelope {
  // The published block (AD-7: carries the winner's ticket + nonce).
  Block block = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the tickets topic: the published ticket + its source.
message TicketEnvelope {
  // The published ticket (AD-4: per-window proof-of-attestation).
  Ticket ticket = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the tx topic: the published tx + its source.
message TxEnvelope {
  // The published tx (amounts as decimal strings, AD-5).
  Tx tx = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// Envelope for the peers topic: the published peer info + its source.
message PeerInfoEnvelope {
  // The published peer info (AD-8 gossip surface).
  PeerInfo peerInfo = 1;
  // 32-byte hex protocol identity id of the publishing node (4.2).
  string sourcePeerId = 2;
}

// ---------------------------------------------------------------------------
// Chain sync (epic 5, story 5.4 — AD-8/AD-12).
//
// Sync is a PULL (a directed request/response over a dedicated libp2p STREAM
// — NOT a gossip topic, D1): the client sends ONE `SyncRequest`
// (`fromSlot`, the client's head + 1), half-closes, and reads the server's
// stream of `SyncBlock`s (one per window, `fromSlot` up to the peer's head)
// until the server half-closes. Both messages are proto-encoded (AD-12) and
// u32be length-prefix framed on the stream (framing is the transport's job,
// not the schema's). Each `SyncBlock` carries, for its window, the block +
// the window's accepted ticket set + the per-ticket uptime weights — exactly
// what the 4.3 acceptance path (`acceptBlockWinner`) needs, so a fresh node
// can verify every block it applies without having collected the gossiped
// tickets for historical windows itself (D3 — fetched alongside the payload).
// The challenge is NOT on the wire: the fresh node derives it from the block's
// own public data (`deriveWindowChallenge(parentHash, slot)`, 3.3).
//
// PURELY ADDITIVE: the eight existing messages (`Block`/`Ticket`/`Tx`/
// `PeerInfo` + the four envelopes) are UNCHANGED — no field-number or type
// changes.
// ---------------------------------------------------------------------------

// The sync request: the slot the client is missing STARTING FROM (its
// `headSlot + 1`; slot 0 for an empty chain). The server streams one
// `SyncBlock` per window from this slot up to its head.
message SyncRequest {
  // Chain-time slot to start the catch-up from (inclusive).
  int64 fromSlot = 1;
}

// One window of the sync stream: the block + the per-window accepted set the
// 4.3 acceptance path needs (D3 — supplied by the sync payload).
message SyncBlock {
  // The window's mined block (AD-7: carries the winner's ticket + nonce).
  Block block = 1;
  // The window's ACCEPTED ticket set (proto `Ticket`, AD-12 wire form) —
  // the per-ticket inputs to `acceptBlockWinner` (4.3), in the SAME order
  // as `weights`.
  repeated Ticket acceptedTickets = 2;
  // The window's per-ticket uptime weights (4.5), one per `acceptedTickets`
  // entry, in the SAME order.
  repeated int64 weights = 3;
}
